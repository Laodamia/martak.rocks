<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marta Krzeminska</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fbf7f0; --text: #2b2724; --muted: #6f6760; --accent: #b5452f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1a18; --text: #ece6dd; --muted: #a69d93; --accent: #e8836b; }
  }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text); font: 17px/1.65 Inter, system-ui, sans-serif; }
  main { padding: 32px 20px; text-align: center; }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 600; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0; }
  span { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Marta Krzeminska</h1>
  <p>Website coming soon<span>.</span></p>
</main>
</body>
</html>
